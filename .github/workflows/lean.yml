name: Lean verification

on:
  push:
    paths:
      - "data/lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "data/lean/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and independently check Lean environment
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: data/lean
          auto-config: "false"
          build: "true"
          build-args: CryptoFrontierAtlas
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          leanchecker: "false"

      - name: Independently check Lean environment
        working-directory: data/lean
        env:
          LEAN_NUM_THREADS: "1"
        run: lake env leanchecker CryptoFrontierAtlas

      - name: Audit admissions and theorem axioms
        working-directory: data/lean
        run: python3 scripts/audit_lean_trust.py

      - name: Replay Balanced-eight data generation
        working-directory: data/lean
        run: python3 scripts/verify_balanced8_provenance.py

      - name: Record source and toolchain provenance
        working-directory: data/lean
        run: python3 scripts/report_lean_provenance.py
